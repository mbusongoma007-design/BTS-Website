<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Bless The Soul</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .contact-form {
            max-width: 600px;
            margin: 0 auto;
            background-color: var(--bg-secondary);
            padding: 2.5rem;
            border: 1px solid var(--border-color);
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
        }
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 0.8rem;
            background-color: var(--bg-primary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            outline: none;
        }
        .form-group textarea {
            height: 140px;
            resize: vertical;
        }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">BLESS THE SOUL</a>
            <nav class="nav-links" id="navLinks">
                <a href="index.html">Home</a>
                <a href="shop.html">Shop</a>
                <a href="collections.html">Collections</a>
                <a href="about.html">About</a>
                <a href="contact.html" class="active">Contact</a>
            </nav>
            <div class="nav-icons">
                <a href="cart.html" class="cart-icon">
                    <i class="fa-solid fa-bag-shopping"></i>
                    <span class="cart-count" id="cartCount">0</span>
                </a>
                <button class="mobile-toggle" id="mobileMenuBtn" aria-label="Toggle Menu">
                    <i class="fa-solid fa-bars"></i>
                </button>
            </div>
        </div>
    </header>

    <section class="page-banner">
        <h1>GET IN TOUCH</h1>
        <p>Customer service, wholesale, and general inquiries</p>
    </section>

    <section class="section">
        <form class="contact-form" onsubmit="event.preventDefault(); alert('Thank you for contacting Bless The Soul.');">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" required placeholder="Enter your full name">
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" required placeholder="Enter your email address">
            </div>
            <div class="form-group">
                <label>Message</label>
                <textarea required placeholder="How can we help?"></textarea>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%;">Send Message</button>
        </form>
    </section>

    <footer class="footer">
        <div class="footer-bottom">
            <p>&copy; 2026 BLESS THE SOUL. All rights reserved.</p>
        </div>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
