<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | Bless The Soul</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .checkout-container {
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 2.5rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .checkout-box {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            padding: 2rem;
            margin-bottom: 2rem;
        }

        .checkout-box h3 {
            font-size: 1.1rem;
            letter-spacing: 2px;
            margin-bottom: 1.5rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--border-color);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.4rem;
            color: var(--text-muted);
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 0.8rem;
            background-color: var(--bg-primary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            outline: none;
            font-size: 0.9rem;
        }

        .payment-methods {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .payment-option {
            flex: 1;
            padding: 1rem;
            border: 1px solid var(--border-color);
            background-color: var(--bg-primary);
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
        }

        .payment-option.active {
            border-color: var(--accent);
            background-color: #222;
        }

        .summary-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.8rem;
            font-size: 0.9rem;
        }

        .summary-item.total {
            border-top: 1px solid var(--border-color);
            padding-top: 1rem;
            margin-top: 1rem;
            font-size: 1.1rem;
            font-weight: bold;
        }

        @media (max-width: 850px) {
            .checkout-container { grid-template-columns: 1fr; }
            .form-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">BLESS THE SOUL</a>
            <nav class="nav-links" id="navLinks">
                <a href="index.html">Home</a>
                <a href="shop.html">Shop</a>
                <a href="collections.html">Collections</a>
                <a href="cart.html">Cart</a>
            </nav>
        </div>
    </header>

    <section class="page-banner">
        <h1>SECURE CHECKOUT</h1>
        <p>Complete your order details below</p>
    </section>

    <section class="section">
        <form id="checkoutForm" onsubmit="processOrder(event)">
            <div class="checkout-container">
                
                <!-- Customer Details & Payment -->
                <div>
                    <!-- Shipping Info -->
                    <div class="checkout-box">
                        <h3>1. SHIPPING ADDRESS</h3>
                        <div class="form-row">
                            <div class="form-group">
                                <label>First Name</label>
                                <input type="text" id="custFirstName" required placeholder="John">
                            </div>
                            <div class="form-group">
                                <label>Last Name</label>
                                <input type="text" id="custLastName" required placeholder="Doe">
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Email Address</label>
                            <input type="email" id="custEmail" required placeholder="john@example.com">
                        </div>
                        <div class="form-group">
                            <label>Street Address</label>
                            <input type="text" id="custAddress" required placeholder="123 Main Street, Apt 4B">
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>City</label>
                                <input type="text" id="custCity" required placeholder="New York">
                            </div>
                            <div class="form-group">
                                <label>Postal Code</label>
                                <input type="text" id="custZip" required placeholder="10001">
                            </div>
                        </div>
                    </div>

                    <!-- Payment Info -->
                    <div class="checkout-box">
                        <h3>2. PAYMENT METHOD</h3>
                        <div class="payment-methods">
                            <div class="payment-option active" onclick="selectPayment('card', this)">
                                <i class="fa-solid fa-credit-card"></i> Card
                            </div>
                            <div class="payment-option" onclick="selectPayment('paypal', this)">
                                <i class="fa-brands fa-paypal"></i> PayPal
                            </div>
                        </div>

                        <div id="cardDetails">
                            <div class="form-group">
                                <label>Cardholder Name</label>
                                <input type="text" id="cardName" placeholder="John Doe">
                            </div>
                            <div class="form-group">
                                <label>Card Number</label>
                                <input type="text" id="cardNumber" placeholder="4532 •••• •••• 8901" maxlength="19">
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label>Expiry Date</label>
                                    <input type="text" id="cardExpiry" placeholder="MM/YY">
                                </div>
                                <div class="form-group">
                                    <label>CVV</label>
                                    <input type="text" id="cardCvv" placeholder="123" maxlength="4">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Order Summary Sidebar -->
                <div>
                    <div class="checkout-box">
                        <h3>ORDER SUMMARY</h3>
                        <div id="checkoutSummaryList">
                            <!-- Items inserted dynamically -->
                        </div>
                        <div class="summary-item" style="margin-top: 1rem; border-top: 1px dashed var(--border-color); padding-top: 1rem;">
                            <span>Subtotal</span>
                            <span id="checkoutSubtotal">$0.00</span>
                        </div>
                        <div class="summary-item">
                            <span>Shipping</span>
                            <span>$15.00</span>
                        </div>
                        <div class="summary-item total">
                            <span>Total</span>
                            <span id="checkoutTotal">$0.00</span>
                        </div>

                        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1.5rem;">
                            Pay & Place Order
                        </button>
                    </div>
                </div>

            </div>
        </form>
    </section>

    <script src="js/script.js"></script>
    <script>
        let selectedPaymentMethod = 'Credit Card';

        document.addEventListener('DOMContentLoaded', loadCheckoutSummary);

        function selectPayment(method, element) {
            document.querySelectorAll('.payment-option').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
            selectedPaymentMethod = method === 'card' ? 'Credit Card' : 'PayPal';
        }

        function loadCheckoutSummary() {
            const cart = JSON.parse(localStorage.getItem('bts_cart')) || [];
            const listEl = document.getElementById('checkoutSummaryList');
            const subtotalEl = document.getElementById('checkoutSubtotal');
            const totalEl = document.getElementById('checkoutTotal');

            if (cart.length === 0) {
                alert('Your bag is empty. Redirecting to shop.');
                window.location.href = 'shop.html';
                return;
            }

            let subtotal = 0;
            listEl.innerHTML = cart.map(item => {
                subtotal += item.price;
                return `
                    <div class="summary-item">
                        <span>${item.name}</span>
                        <span>$${item.price.toFixed(2)}</span>
                    </div>
                `;
            }).join('');

            const shipping = 15.00;
            subtotalEl.textContent = `$${subtotal.toFixed(2)}`;
            totalEl.textContent = `$${(subtotal + shipping).toFixed(2)}`;
        }

        function processOrder(e) {
            e.preventDefault();

            const cart = JSON.parse(localStorage.getItem('bts_cart')) || [];
            if (cart.length === 0) return;

            let subtotal = cart.reduce((sum, item) => sum + item.price, 0);
            let grandTotal = subtotal + 15.00;

            const newOrder = {
                id: 'BTS-' + Math.floor(100000 + Math.random() * 900000),
                date: new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }),
                customer: {
                    name: document.getElementById('custFirstName').value + ' ' + document.getElementById('custLastName').value,
                    email: document.getElementById('custEmail').value,
                    address: document.getElementById('custAddress').value + ', ' + document.getElementById('custCity').value
                },
                items: cart,
                total: grandTotal,
                paymentMethod: selectedPaymentMethod,
                paymentStatus: 'Paid',
                fulfillmentStatus: 'Processing'
            };

            // Save order to LocalStorage for Admin panel
            let existingOrders = JSON.parse(localStorage.getItem('bts_orders')) || [];
            existingOrders.unshift(newOrder); // newest first
            localStorage.setItem('bts_orders', JSON.stringify(existingOrders));

            // Clear cart
            localStorage.removeItem('bts_cart');

            alert(`Order Successful!\n\nOrder ID: ${newOrder.id}\nThank you for shopping with Bless The Soul.`);
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
