<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart | Bless The Soul</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .cart-wrapper {
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 2rem;
        }
        .cart-items {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            padding: 1.5rem;
        }
        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 0;
            border-bottom: 1px solid var(--border-color);
        }
        .cart-item:last-child { border-bottom: none; }
        .cart-summary {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            padding: 1.5rem;
            height: fit-content;
        }
        .cart-summary h3 {
            margin-bottom: 1rem;
            letter-spacing: 1px;
        }
        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.8rem;
            color: var(--text-muted);
        }
        .summary-row.total {
            color: var(--text-primary);
            font-weight: bold;
            font-size: 1.1rem;
            border-top: 1px solid var(--border-color);
            padding-top: 1rem;
            margin-top: 1rem;
        }
        .remove-btn {
            background: none;
            border: none;
            color: #ff5555;
            cursor: pointer;
        }
        @media (max-width: 768px) {
            .cart-wrapper { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">BLESS THE SOUL</a>
            <nav class="nav-links" id="navLinks">
                <a href="index.html">Home</a>
                <a href="shop.html">Shop</a>
                <a href="collections.html">Collections</a>
                <a href="about.html">About</a>
                <a href="contact.html">Contact</a>
            </nav>
            <div class="nav-icons">
                <a href="cart.html" class="cart-icon">
                    <i class="fa-solid fa-bag-shopping"></i>
                    <span class="cart-count" id="cartCount">0</span>
                </a>
            </div>
        </div>
    </header>

    <section class="page-banner">
        <h1>YOUR BAG</h1>
    </section>

    <section class="section">
        <div class="cart-wrapper">
            <div class="cart-items" id="cartItemsList">
                <!-- JavaScript handles rendering items dynamically -->
            </div>
            <div class="cart-summary">
                <h3>ORDER SUMMARY</h3>
                <div class="summary-row">
                    <span>Subtotal</span>
                    <span id="subtotal">$0.00</span>
                </div>
                <div class="summary-row">
                    <span>Shipping</span>
                    <span>Calculated at checkout</span>
                </div>
                <div class="summary-row total">
                    <span>Total</span>
                    <span id="grandTotal">$0.00</span>
                </div>
                <button class="btn btn-primary" style="width: 100%; margin-top: 1.5rem;" onclick="alert('Proceeding to checkout...');">Checkout</button>
            </div>
        </div>
    </section>

    <script src="js/script.js"></script>
    <script src="js/cart.js"></script>
</body>
</html>
